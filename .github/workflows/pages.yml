name: Deploy project explorer
on:
  workflow_dispatch:
    inputs:
      publish_publicly:
        description: 'Publish the project publicly on GitHub Pages'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    # Public releases use an explicit manual opt-in and a public repository.
    if: inputs.publish_publicly == true && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Check GitHub Pages activation
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10'})
          try:
              with urllib.request.urlopen(request) as response:
                  json.load(response)
              enabled = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          if not enabled:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## GitHub Pages activation required\n\nThe checked site artifact is ready. In Settings → Pages, choose GitHub Actions as the source, then rerun this workflow to publish it.\n')
          PY
      - run: python -m pip install -r requirements-analysis.txt
      - run: make site
      - uses: actions/configure-pages@v5
        if: steps.pages_status.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
