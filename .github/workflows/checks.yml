name: Verify data and results
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: make check
      - name: Check reproducible explorer payload
        run: |
          make site
          git diff --exit-code -- docs/assets/explorer.json docs/assets/explorer-index.js docs/assets/geometry docs/assets/neighbourhood docs/assets/explorer-validation.json
